<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AQIAPP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        padding-top: 70px;
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom right, #4facfe, #8e44ad);
        color: white;
        text-align: center;
      }
      .search-container { 
        margin: 20px auto; 
        max-width: 600px; 
      }
      .card {
        padding: 20px;
        border-radius: 12px;
        max-width: 500px;
        margin: 30px auto 0;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        transition: background 0.5s ease;
        color: white;
      }
      .aqi-good { background: #009966; }
      .aqi-fair { background: #ffde33; color: #000; }
      .aqi-moderate { background: #ff9933; }
      .aqi-poor { background: #cc0033; }
      .aqi-very-poor { background: #660099; }
      input[type="text"] {
        padding: 10px;
        border-radius: 8px;
        border: none;
        width: 250px;
        margin-right: 8px;
      }
      button {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background-color: #fff;
        color: #333;
        cursor: pointer;
        font-weight: bold;
      }
      #loading { margin-top: 30px; font-size: 18px; }
      .pollutants { margin-top: 20px; text-align: left; }
      .pollutant { margin-bottom: 12px; }
      .bar { height: 18px; border-radius: 10px; background: #444; margin-top: 5px; position: relative; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }
      .label { font-size: 14px; font-weight: bold; }
      canvas { max-width: 100%; margin-top: 40px; }
      /* Fixed Navbar */
      .navbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
      /* Content Adjustments */
      #content {
        padding-bottom: 70px; /* Space for the fixed navbar */
      }
    </style>
  </head>
  <body>
    <div id="content">
      <h1>Live Air Quality Index</h1>
      <div class="search-container">
        <input type="text" id="city-input" placeholder="Enter city name..." />
        <button onclick="searchCity()">Search</button>
      </div>
      <div id="aqi-card" class="card" style="display: none;">
        <h2 id="location-name">Your Location AQI</h2>
        <p><strong>Coordinates:</strong> <span id="city"></span></p>
        <p><strong>AQI:</strong> <span id="aqi"></span></p>
        <p><strong>Dominant Pollutant:</strong> <span id="pollutant"></span></p>
        <div class="pollutants" id="pollutant-bars"></div>
      </div>
      <p id="loading">Fetching location and AQI...</p>
      <canvas id="aqi-chart" width="400" height="200" style="display: none;"></canvas>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);">
      <div class="d-flex justify-content-center flex-grow-1">
        <a 
          href="index.html" 
          class="nav-link" 
          id="nav-profile-tab" 
          style="color: black; background-color: white; padding: 10px 20px; border-radius: 15px; border: 2px solid #ccc; cursor: pointer;"
        >
          Home
        </a>
      </div>

        <!-- Center aligned item -->
        <div class="d-flex justify-content-center flex-grow-1">
          <a 
            href="chart.html" 
            class="nav-link" 
            id="nav-profile-tab" 
            style="color: black; background-color: white; padding: 10px 20px; border-radius: 15px; border: 2px solid #ccc; cursor: pointer;"
          >
            AQI Chart
          </a>
        </div>
        <!-- Right aligned item -->
        <div class="d-flex justify-content-center flex-grow-1">
          <a 
            href="compare.html" 
            class="nav-link" 
            id="nav-profile-tab" 
            style="color: black; background-color: white; padding: 10px 20px; border-radius: 15px; border: 2px solid #ccc; cursor: pointer;"
          >
            Compare
          </a>
        </div>

   <script src="script.js"></script>
  </body>
</html>
